webdriver {
    driver = chrome
    base.url = "https://automationexercise.com/"
    wait.for.timeout = 20000

    capabilities {
        browserName = "chrome"
        acceptInsecureCerts = true
        pageLoadStrategy = "normal"
        timeouts {
            implicit = 10000
            script = 60000
            pageLoad = 60000
        }
        "goog:chromeOptions" {
            args = ["--start-maximized", "--no-sandbox", "--disable-dev-shm-usage", "--disable-extensions", "--disable-popup-blocking", "--disable-gpu"]
        }
    }
}

headless.mode = false

serenity {
    project.name = "Serenity Screenplay - AutomationExercise"
    take.screenshots = FOR_FAILURES
    console.colors = true
}